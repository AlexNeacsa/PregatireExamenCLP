<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLP 2025 — Pregătire Examen</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --border: #2a3349;
    --blue: #3b82f6;
    --blue-light: #93c5fd;
    --blue-dim: #1e3a5f;
    --green: #22c55e;
    --green-dim: #14532d;
    --red: #ef4444;
    --red-dim: #450a0a;
    --amber: #f59e0b;
    --amber-dim: #451a03;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    width: 36px; height: 36px;
    background: var(--blue);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff; flex-shrink: 0;
  }

  header h1 { font-size: 17px; font-weight: 600; }
  header p { font-size: 12px; color: var(--text2); margin-top: 1px; }

  .container { max-width: 860px; margin: 0 auto; padding: 28px 20px; }

  .tabs {
    display: flex; gap: 4px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 28px;
  }

  .tab {
    flex: 1; padding: 10px 16px;
    border: none; background: transparent;
    color: var(--text2); font-size: 14px;
    cursor: pointer; border-radius: 7px;
    transition: all 0.2s; font-weight: 500;
  }
  .tab:hover { color: var(--text); background: var(--bg3); }
  .tab.active { background: var(--blue); color: #fff; }

  .section { display: none; }
  .section.active { display: block; }

  /* REZUMAT */
  .chapter {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .chapter:hover { border-color: #3a4560; }

  .ch-head {
    padding: 14px 18px;
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    user-select: none;
  }
  .ch-head-left { display: flex; align-items: center; gap: 10px; }
  .ch-num {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--blue-dim); color: var(--blue-light);
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ch-title { font-size: 14px; font-weight: 600; }
  .ch-arrow {
    color: var(--text3); font-size: 16px;
    transition: transform 0.25s; flex-shrink: 0;
  }
  .chapter.open .ch-arrow { transform: rotate(180deg); }

  .ch-body { display: none; padding: 0 18px 18px; }
  .chapter.open .ch-body { display: block; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tag {
    background: var(--blue-dim); color: var(--blue-light);
    font-size: 11px; padding: 3px 9px;
    border-radius: 20px; font-weight: 500;
  }

  .item {
    font-size: 13.5px; line-height: 1.65;
    padding: 8px 12px;
    border-left: 2px solid var(--border);
    margin-bottom: 6px;
    color: var(--text2);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    background: var(--bg3);
  }
  .item strong { color: var(--blue-light); font-weight: 600; }
  .item em { color: var(--amber); font-style: normal; }

  /* GRILE */
  .stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 20px;
  }
  .stat {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 16px;
    text-align: center;
  }
  .stat-n { font-size: 24px; font-weight: 700; }
  .stat-l { font-size: 11px; color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }

  .progress-bar {
    height: 5px; background: var(--bg3);
    border-radius: 3px; margin-bottom: 20px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--blue), var(--green));
    border-radius: 3px; transition: width 0.4s ease;
  }

  .btn-new {
    padding: 9px 22px;
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm);
    cursor: pointer; font-size: 13px; font-weight: 500;
    margin-bottom: 24px; transition: all 0.2s;
  }
  .btn-new:hover { background: var(--bg3); border-color: var(--blue); color: var(--blue-light); }

  .q-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    margin-bottom: 14px; transition: border-color 0.2s;
  }

  .q-num {
    font-size: 11px; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 8px; font-weight: 600;
  }

  .q-text {
    font-size: 14.5px; font-weight: 600;
    margin-bottom: 14px; line-height: 1.55;
    color: var(--text);
  }

  .opt {
    display: block; width: 100%;
    text-align: left; padding: 10px 14px;
    margin-bottom: 7px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2); font-size: 13.5px;
    cursor: pointer; transition: all 0.15s;
    line-height: 1.5;
  }
  .opt:hover:not(:disabled) { border-color: var(--blue); color: var(--text); background: var(--blue-dim); }
  .opt:disabled { cursor: default; }

  .opt.correct {
    background: var(--green-dim); border-color: var(--green);
    color: #86efac; font-weight: 500;
  }
  .opt.wrong {
    background: var(--red-dim); border-color: var(--red);
    color: #fca5a5;
  }
  .opt.show-correct {
    background: var(--green-dim); border-color: var(--green);
    color: #86efac;
  }

  .exp {
    display: none; margin-top: 12px;
    padding: 12px 14px;
    background: var(--bg3); border-left: 3px solid var(--blue);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    font-size: 13px; color: var(--text2); line-height: 1.6;
  }
  .exp.show { display: block; }
  .exp::before {
    content: '💡 '; font-size: 13px;
  }

  .q-card.answered-correct { border-color: #166534; }
  .q-card.answered-wrong { border-color: #7f1d1d; }

  footer {
    text-align: center; padding: 32px 20px;
    color: var(--text3); font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  @media (max-width: 600px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .ch-title { font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">CLP</div>
  <div>
    <h1>Circuite Logice Programabile — 2025</h1>
    <p>Rezumat &amp; Grile de pregătire pentru examen</p>
  </div>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('rezumat', this)">📚 Rezumat pentru examen</button>
    <button class="tab" onclick="switchTab('grile', this)">✏️ Grile practice</button>
  </div>

  <!-- REZUMAT -->
  <div id="rezumat" class="section active">
    <div id="chapters"></div>
  </div>

  <!-- GRILE -->
  <div id="grile" class="section">
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-n" id="s-total">0</div>
        <div class="stat-l">Întrebări</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="s-correct" style="color:var(--green)">0</div>
        <div class="stat-l">Corecte</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="s-wrong" style="color:var(--red)">0</div>
        <div class="stat-l">Greșite</div>
      </div>
      <div class="stat">
        <div class="stat-n" id="s-pct" style="color:var(--amber)">—</div>
        <div class="stat-l">Scor</div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
    <button class="btn-new" onclick="loadQuiz()">↻ Grile noi (10 aleatorii)</button>
    <div id="quiz-container"></div>
  </div>

</div>

<footer>CLP 2025 · Aplicație offline pentru pregătirea examenului · Deschide în orice browser</footer>

let score = { total: 0, correct: 0, wrong: 0 };
let answered = {};
let currentQuestions = [];

function switchTab(t, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(t).classList.add('active');
}

function buildChapters() {
  const cont = document.getElementById('chapters');
  chapters.forEach((ch, i) => {
    const d = document.createElement('div');
    d.className = 'chapter';
    d.innerHTML = `
      <div class="ch-head" onclick="toggleCh(${i})">
        <div class="ch-head-left">
          <div class="ch-num">${i + 1}</div>
          <div class="ch-title">${ch.title}</div>
        </div>
        <div class="ch-arrow" id="arr-${i}">▼</div>
      </div>
      <div class="ch-body" id="ch-${i}">
        <div class="tags">${ch.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        ${ch.items.map(it => `<div class="item">${it}</div>`).join('')}
      </div>`;
    cont.appendChild(d);
  });
}

function toggleCh(i) {
  const ch = document.querySelectorAll('.chapter')[i];
  const open = ch.classList.contains('open');
  ch.classList.toggle('open', !open);
}

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

function loadQuiz() {
  answered = {};
  currentQuestions = shuffle([...allQuestions]).slice(0, 10);
  const cont = document.getElementById('quiz-container');
  cont.innerHTML = '';
  currentQuestions.forEach((q, qi) => {
    const shuffledOpts = q.opts.map((o, i) => ({ t: o, orig: i }));
    shuffle(shuffledOpts);
    const correctNew = shuffledOpts.findIndex(o => o.orig === q.ans);
    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.qi = qi;
    card.dataset.correct = correctNew;
    card.innerHTML = `
      <div class="q-num">Întrebarea ${qi + 1} din ${currentQuestions.length}</div>
      <div class="q-text">${q.q}</div>
      ${shuffledOpts.map((o, oi) =>
        `<button class="opt" onclick="answer(${qi}, ${oi}, ${correctNew}, this.closest('.q-card'))">${String.fromCharCode(65 + oi)}. ${o.t}</button>`
      ).join('')}
      <div class="exp" id="exp-${qi}">${q.exp}</div>`;
    cont.appendChild(card);
  });
  updateStats();
}

function answer(qi, chosen, correct, card) {
  if (answered[qi] !== undefined) return;
  const isCorrect = chosen === correct;
  answered[qi] = isCorrect;
  if (isCorrect) { score.correct++; score.total++; }
  else { score.wrong++; score.total++; }
  card.querySelectorAll('.opt').forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) btn.classList.add(isCorrect ? 'correct' : 'show-correct');
    if (i === chosen && !isCorrect) btn.classList.add('wrong');
  });
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
  document.getElementById('exp-' + qi).classList.add('show');
  updateStats();
}

function updateStats() {
  document.getElementById('s-total').textContent = score.total;
  document.getElementById('s-correct').textContent = score.correct;
  document.getElementById('s-wrong').textContent = score.wrong;
  const pct = score.total ? Math.round(score.correct / score.total * 100) + '%' : '—';
  document.getElementById('s-pct').textContent = pct;
  const prog = score.total ? Math.round(score.correct / score.total * 100) : 0;
  document.getElementById('prog').style.width = prog + '%';
}

buildChapters();
loadQuiz();
